<!Doctype html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">        
    </head>
    <body>
        <div class="container">
            <h1  class = "header_text">Will you be my Valentine Forever cutiee??</h1>


        <div class="gif_container">
            <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcDdtZ2JiZDR0a3lvMWF4OG8yc3p6Ymdvd3g2d245amdveDhyYmx6eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Valentine's Day Gif">
        </div>

        <div class="gif_container">
            <audio controls autoplay>
                <source src="KhwabHoTum.mp3" type="audio/mp3">
                </audio>
         </div>
       <br>
       <br>
        <div class="buttons">
            <button class = "btn" id = "yesButton" onclick="nextPage()">Yes</button>
            <button class = "btn" id="noButton" onmouseover="moveButton()" onclick="moveButton()">No</button>
 
        <script>
       
            function nextPage() {
                window.location.href = "yes.html";
            }
            
            function moveButton() {
                var x = Math.random() * (window.innerWidth - document.getElementById('noButton').offsetWidth) - 80;
                var y = Math.random() * (window.innerHeight - document.getElementById('noButton').offsetHeight) - 45;
                document.getElementById('noButton').style.left = `${x}px`;
                document.getElementById('noButton').style.top = `${y}px`;
            }

      
        </script> 
        </div>
    </div>
    </body>
</html>
